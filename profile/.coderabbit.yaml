# Organization-wide CodeRabbit configuration.
# Applies to repositories without local CodeRabbit config.

language: en-US

reviews:
  profile: chill
  high_level_summary: false
  review_status: false
  collapse_walkthrough: true
  poem: false

  # Macroscope handles automatic approvals.
  auto_approvals:
    enabled: false

  # Automatic code review for researchers.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  # Avoid universal documentation requirements
  # for exploratory research code.
  pre_merge_checks:
    docstrings:
      mode: off
